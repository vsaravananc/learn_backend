[project]
name = "login-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saravanan v", email = "v.saravanan.c@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "pwdlib[argon2]>=0.4.2",
    "pyjwt>=2.15.1",
    "ruff>=0.17.6",
    "sqlmodel>=0.0.50",
]

[tool.fastapi]
entrypoint = "src.login_backend.main:app"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
